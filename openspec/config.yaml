schema: spec-driven

context: |
  Project: react2 — SupportDesk (support ticket management)
  Tech stack: React 18+, TypeScript, Redux Toolkit, RTK Query, MSW, React Router, Zod
  Architecture: Feature-based with Redux slices, RTK Query for API mocking/data
  Testing: Not yet initialized — no package.json or test runner installed
  Style: TBD — awaiting project scaffolding

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
